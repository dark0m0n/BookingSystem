name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore TicketBooking.slnx

      - name: Build
        run: dotnet build TicketBooking.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TicketBooking.slnx --configuration Release --no-build --no-restore
